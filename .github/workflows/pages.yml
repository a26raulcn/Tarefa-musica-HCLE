name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar e preparar
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verificar JavaScript
        run: |
          node --check dist/audio.js
          node --check dist/import.js
          node --check dist/app.js
      - name: Testar áudio e importação
        run: |
          node tests/audio.test.cjs
          node tests/import.test.cjs
      - name: Preparar os ficheiros do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar o site
        id: deployment
        uses: actions/deploy-pages@v4
